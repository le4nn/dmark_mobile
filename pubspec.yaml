name: dmark_mobile_intership
description: "Warehouse inventory management app (Clean Architecture, Hive, Riverpod)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  image_picker: ^1.2.0
  google_fonts: ^6.3.2
  flex_color_scheme: ^7.3.1
  flutter_staggered_animations: ^1.1.1
  responsive_builder: ^0.7.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
